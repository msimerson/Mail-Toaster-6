name: Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: master

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KCOV_VERSION: 43
    steps:
      - name: Identify OS release
        id: os
        run: . /etc/os-release && echo "release=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Cache kcov
        id: cache-kcov
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/kcov
          key: ${{ runner.os }}-${{ steps.os.outputs.release }}-kcov-v${{ env.KCOV_VERSION }}
      # Only the build needs these. The libraries kcov loads at runtime ship
      # with the runner image, and the Azure apt mirror can stall for minutes.
      - name: Install Build Dependencies
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            pkg-config \
            libcurl4-openssl-dev \
            libdw-dev \
            binutils-dev \
            libiberty-dev \
            zlib1g-dev \
            libelf-dev
      - name: Install kcov from source
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/SimonKagstrom/kcov/archive/v$KCOV_VERSION.tar.gz
          tar xzf v$KCOV_VERSION.tar.gz && cd kcov-$KCOV_VERSION
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          sudo make install
          cd ../../
      # the dynamic loader names any shared library the cached binary lacks
      - name: Verify kcov runs
        run: kcov --version
      - uses: actions/checkout@v6
      - name: Run kcov
        run: sh ./test/coverage.sh
      - name: codecov
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage/
      - uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/lcov.info

      # - name: Coveralls
      #   uses: coverallsapp/github-action@master
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
